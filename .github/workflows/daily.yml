name: Daily Brief

# Generate a fresh daily report and publish to GitHub Pages.
#
# Schedule: 每 15 分钟触发一次（UTC）——一是监测 cron 是否正常，二是提高命中放行窗口的概率
#   （GitHub schedule 为 best-effort，实测丢触发率约 70%，窗口内多打几次才稳）。
# 真正放行由 gate 决定：
#   - REPORT_TIMES（默认 "7:00"，北京时间 HH:MM 逗号列表）+ WINDOW_MIN 容差窗口
#     （默认 60 分钟）：目标点 ±60 分钟内触发均放行（7:00 → 北京时间 6:00-8:00）
#     —— 即 6-8 点之间任意一次 cron 触发都会构建报告（2026-08-29 用户定）
#   - 窗口内每次命中都跑 build（全 AI 标新数据）；「一天最多发布一次」由 publish 步骤把控
#   - 并发检查：同 workflow 前一 run 仍在 in_progress 则本次直接跳过
#     （用 Actions API 而非 concurrency —— concurrency 是 QUEUE 延迟，不是 SKIP）
# workflow_dispatch 手动触发有三个开关（2026-09-03：notify_wechat / notify_serverchan
# 已删除 —— 微信推送改为手动触发，见独立 workflow notify.yml）：
#   - skip_ai: 跳过全部 LLM 调用（复用 data/article-history.json 里的 AI 摘要，
#     等价原 test2 失败恢复 / 无 AI 验证，零 LLM 成本）
#   - publish: 是否发布 gh-pages（false = 仅验证 + 上传 artifact，等价原 test1）
# cron（schedule）触发固定为全 AI + 发布；外发推送一律由 notify.yml 人工触发
# （发布后核对 gh-pages → 手动 Run workflow）。

on:
  schedule:
    # 每 15 分钟一次（UTC）。
    # 放行窗口为北京时间 6:00-8:00 = UTC 22:00-00:00（跨 UTC 日界），
    # 窗口内共 8 个触发点（22:00 / 22:15 / ... / 23:45），
    # 配合 GitHub 约 70% 的丢触发率，仍能大概率命中（原 :10/:40 一天仅 2 个点，太容易全丢）。
    # gate 只放行 REPORT_TIMES 配置的北京时间点（默认 7:00，±WINDOW_MIN=60 分钟）
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      # 2026-08-28 用户需求：3 个开关独立可选，手动选的优先级最高
      # （即显式 false/true 覆盖 schedule 默认）。
      skip_ai:
        description: '跳过全部 LLM 调用（复用历史缓存摘要，零 AI 成本；等价原 test2/无 AI 验证）'
        type: boolean
        default: false
      audio:
        description: '生成新音频（false = 跳过音频合成，页面不挂播放器；用于只想看报告文字时省 TTS 成本）'
        type: boolean
        default: true
      publish:
        description: '发布到 gh-pages（false = 仅验证 + 上传 artifact，不发布；等价原 test1）。微信推送不再随本工作流自动执行，发布后请核对 gh-pages 并手动触发 notify.yml。'
        type: boolean
        default: true

permissions:
  contents: write  # needed to push to gh-pages branch

jobs:
  gate:
    name: Time & concurrency gate
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
    steps:
      - name: Check schedule
        id: check
        env:
          REPORT_TZ: ${{ vars.REPORT_TZ }}
          REPORT_TIMES: ${{ vars.REPORT_TIMES }}
          REPORT_DAYS: ${{ vars.REPORT_DAYS }}
          WINDOW_MIN: ${{ vars.WINDOW_MIN }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # Manual triggers always run — user clicked Run workflow.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual trigger — bypassing gate"
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip if a previous run of this workflow is still in progress.
          RUNNING=$(curl -s \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/daily.yml/runs?status=in_progress&per_page=20" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(len([r for r in d.get('workflow_runs',[]) if r['id'] != ${RUN_ID}]))" 2>/dev/null || echo 0)
          echo "Other running runs of daily.yml: $RUNNING"
          if [ "$RUNNING" -gt 0 ]; then
            echo "→ Previous run still in progress — skipping this trigger"
            echo "should-build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TZ_VAL="${REPORT_TZ:-Asia/Shanghai}"
          TIMES_VAL="${REPORT_TIMES:-7:00}"
          DAYS_VAL="${REPORT_DAYS:-*}"

          # %-H: GNU date 无前导零（GitHub ubuntu 支持），与配置 "7:00" 匹配
          NOW_HM=$(TZ="$TZ_VAL" date +%-H:%M)
          NOW_DOW=$(TZ="$TZ_VAL" date +%w)
          NOW_PRINT=$(TZ="$TZ_VAL" date '+%Y-%m-%d %H:%M %Z')

          echo "Now in $TZ_VAL: $NOW_PRINT (time=$NOW_HM, dow=$NOW_DOW)"
          echo "Configured REPORT_TIMES='$TIMES_VAL', REPORT_DAYS='$DAYS_VAL'"

          # Time match（2026-08-20 修复；2026-08-29 放宽）：GitHub Actions 的 schedule 触发有排队延迟
          # （实测 20-50 分钟，run 常在 :3x-:5x 才启动），分钟级精确匹配（"7:00"）永远
          # 命中不了 → 自动发布从未成功。改为「目标时刻 ± WINDOW_MIN 分钟」窗口匹配
          # （2026-08-29 起默认 60：7:00 → 北京时间 6:00-8:00 放行，即 6-8 点间任意触发都构建）。
          # cron 同步加密到 15 分钟一次：窗口内 8 个触发点，即便 GitHub 丢掉大部分也能命中。
          WINDOW_MIN="${WINDOW_MIN:-60}"
          NOW_TOTAL=$(( $(TZ="$TZ_VAL" date +%-H) * 60 + $(TZ="$TZ_VAL" date +%-M) ))
          time_match=false
          IFS=',' read -ra TLIST <<< "$TIMES_VAL"
          for t in "${TLIST[@]}"; do
            t_trim="${t// /}"
            t_h="${t_trim%%:*}"; t_m="${t_trim##*:}"
            tgt=$(( 10#$t_h * 60 + 10#$t_m ))
            diff=$(( NOW_TOTAL - tgt ))
            if [ "${diff#-}" -le "$WINDOW_MIN" ]; then
              time_match=true
              break
            fi
          done
          echo "Time window: WINDOW_MIN=$WINDOW_MIN, now_minute=$NOW_TOTAL, time_match=$time_match"

          # Day-of-week match: '*', single digits, ranges "a-b", or comma combos.
          day_match=false
          if [ "$DAYS_VAL" = "*" ]; then
            day_match=true
          else
            IFS=',' read -ra DLIST <<< "$DAYS_VAL"
            for d in "${DLIST[@]}"; do
              d_trim="${d// /}"
              if [[ "$d_trim" == *-* ]]; then
                start="${d_trim%-*}"
                end="${d_trim#*-}"
                if [ "$NOW_DOW" -ge "$start" ] && [ "$NOW_DOW" -le "$end" ]; then
                  day_match=true
                  break
                fi
              else
                if [ "$NOW_DOW" = "$d_trim" ]; then
                  day_match=true
                  break
                fi
              fi
            done
          fi

          # 2026-08-27 改：gate 只看 time+day match，不再检查「当日已发布」——
          # build 每次时间窗触发都跑（全 AI 标 fresh data）。
          # 「一天最多发布一次」挪到 publish 步骤（不影响 build）：
          #   窗口内首次命中（北京 6:00-8:00 间某次 15 分钟触发）：build（AI）+ publish（如未发）
          #   窗口内后续命中：build（AI，标新抓数据）+ publish 跳过（如当天已发）
          # 这保证：无论 SKIP_AI 何时发布，新抓数据都保证被全 AI 标过。
          if [ "$time_match" = "true" ] && [ "$day_match" = "true" ]; then
            echo "✓ Time & day match — proceeding to build (full AI)"
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          else
            echo "✗ No match — skipping (time=$time_match day=$day_match)"
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & publish
    needs: gate
    if: needs.gate.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 探测腾讯密钥是否配置（step 级 if 不支持 secrets 上下文，先转成输出再判断）
      - name: Detect Tencent TTS secret
        id: tencent-check
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
        run: |
          if [ -n "${TENCENTCLOUD_SECRET_ID}" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------- ffmpeg（腾讯 concat 重编码 + Piper WAV→MP3 都需要，始终安装）----------
      # 2026-08-24：腾讯路径 mergeMp3 已改 libmp3lame 重编码拼接，同样依赖 ffmpeg。
      - name: Install ffmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already present: $(ffmpeg -version 2>/dev/null | head -1)"
          else
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          command -v ffmpeg >/dev/null 2>&1 || { echo "::error::ffmpeg 安装失败"; exit 1; }

      # ---------- Piper 本地 TTS（2026-08-24 调整：仅两种场景启用）----------
      # 场景A（主用）：未配置腾讯密钥 → Piper 作为主用，须在 daily 前装好；
      # 场景B（兜底）：配置了腾讯密钥但腾讯合成失败 → tts.ts 写
      #   data/history/reports/<date>/tts-fallback-needed.txt 标记，daily 之后
      #   条件安装 Piper 并跑 scripts/tts-fallback.ts 补合成（见 daily 后步骤）。
      # 腾讯包月场景（有密钥）日常不再预装 Piper，避免每次运行白装。
      - name: Setup Python (Piper 主用，无腾讯时)
        if: ${{ steps.tencent-check.outputs.has == 'false' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Piper model (主用)
        if: ${{ steps.tencent-check.outputs.has == 'false' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/piper
          key: piper-zh_CN-huayan-medium-v1
          restore-keys: |
            piper-zh_CN-huayan-medium-

      - name: Install Piper TTS (主用)
        if: ${{ steps.tencent-check.outputs.has == 'false' }}
        run: python3 -m pip install --upgrade pip piper-tts

      # Bring previous reports into the workspace so they survive each run
      # and so build-site can list them all in the archive.
      # 2026-08-19 修复：原 `git --work-tree=daily_reports checkout origin/gh-pages -- .`
      # 会把 gh-pages 内容 staged 进 main 的暂存区 → 后续 Commit 步骤把根目录发布物
      # （2026-08-xx/、index.html、archive.html）误提交到 main。改用 git archive
      # 解包恢复，完全不碰 git index。
      - name: Restore existing reports from gh-pages
        run: |
          mkdir -p daily_reports
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git archive origin/gh-pages | tar -x -C daily_reports
            # Drop the index/archive — build-site regenerates them
            rm -f daily_reports/index.html daily_reports/archive.html
            restored=$(ls -1d daily_reports/20*/ 2>/dev/null | wc -l | tr -d ' ')
            echo "Restored ${restored} prior report dirs"
            # Guard against accidentally wiping published history: publish
            # uses keep_files:false, so if restore produced nothing the push
            # would delete every historical report. Abort instead.
            if [ "${restored}" -eq 0 ]; then
              echo "::error::gh-pages restore produced no report dirs — aborting to avoid wiping published history"
              exit 1
            fi
          else
            echo "gh-pages doesn't exist yet — first run"
          fi

      # ---------- 爬虫（Exchange IPO 六源 + 广州商机三源）已 TS 化 ----------
      # M3-A：不再 shell 出去跑 scripts/crawlers/*.mjs，也不再产出 crawled-*.json；
      # 由 daily.ts 进程内调用 lib/sources/crawlers 的 fetchCrawledArticles() 直接抓取并归一化。

      # ---------- 当日已发布检查（2026-09-03 前移 + 判据改为发布来源）----------
      # 原在 build-site 之后执行；现提前到 daily 之前 —— 本步纯读 main 的
      # data/publish-state.json（无 build 依赖），提前后可产出 PUBLISH_RUN env：
      # schedule 首发 publish（当天还没有 schedule 正式首发）或 dispatch publish=true
      # → true。daily.ts 据此只在「上线 run」落盘内容记忆（today 恒 = gh-pages 实际
      # 内容；本地/验证/同日后续 build 只读不写，见 executive-summary.ts persistMemory）。
      # 2026-09-03 判据严谨化：原先查 gh-pages 当天目录是否存在（HTTP 404→未发布），
      # 是弱信号 —— dispatch publish=true 的测试/覆盖与 schedule 正式首发在 gh-pages
      # 上长得一样，凌晨测试抢占当天目录会让 schedule 误判「今天已发布」而跳过正式首发。
      # 现改为读发布来源记录（lib/publish-state.ts，publish 成功后写入 main）：只认
      # 「当天存在 source=schedule 的正式首发」才跳过；source=manual（dispatch 覆盖）
      # 不阻断同日 schedule 首发 —— 首次 schedule 命中会再发正式版覆盖测试版。
      # 2026-08-28 用户反馈：'我手动选的，是全局最高变量' —— manual 触发 inputs.publish=true
      # 必须强制发布（覆盖已发布），不再 silent skip。'已发布跳过' 只对 schedule 触发生效。
      # 2026-09-02 修复史：原 `TZ='${TZ:-Asia/Shanghai}'` 单引号不展开 → date 退回 UTC
      # → 取到前一天 → 定时任务永远跳过发布。TZ 必须双引号展开。
      - name: Check if today's report already published
        if: github.event_name == 'schedule'
        id: published-check
        env:
          REPORT_TZ: ${{ vars.REPORT_TZ }}
        run: |
          TODAY=$(TZ="${REPORT_TZ:-Asia/Shanghai}" date +%Y-%m-%d)
          echo "Checking publish state for date=${TODAY} (tz=${REPORT_TZ:-Asia/Shanghai})"
          if [ -f data/publish-state.json ]; then
            SCHEDULED=$(node -e "const s=JSON.parse(require('fs').readFileSync('data/publish-state.json','utf8'));const e=(s.reports||{})[process.argv[1]];process.stdout.write(e&&e.source==='schedule'?'yes':'no')" "$TODAY")
          else
            SCHEDULED=no
          fi
          echo "schedule-published=${SCHEDULED}"
          if [ "$SCHEDULED" = "yes" ]; then
            echo "Today already has a schedule release (source=schedule) — skipping publish, build still produces full AI artifacts"
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "✓ No schedule release yet today — will publish (manual overrides don't block the first schedule run)"
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          fi

      # 生成当日报告（全 AI 流程）。skip_ai=true（手动触发时勾选）→ 复用历史缓存摘要，
      # 不触发任何 LLM 调用（等价原 test2 失败恢复 / test1 无 AI 验证）。
      # schedule 触发时 inputs 为空 → SKIP_AI 为空 → 全 AI。
      # daily 同时导出 data/fetched-articles.json（信息源抓取结果），供「预 AI 分析加载」任务拉回比对。
      # PUBLISH_RUN：本 run 是否上线（schedule 首发 / dispatch publish=true）→ 内容记忆只在此落盘。
      - name: Generate today's report
        env:
          SKIP_AI: ${{ inputs.skip_ai && 'true' || '' }}
          AUDIO_ENABLED: ${{ inputs.audio && 'true' || 'false' }}
          # 本 run 是否上线（2026-09-03）：schedule 首发（published-check=true）或
          # dispatch publish=true → true；内容记忆（event-memory）只在上线 run 落盘。
          PUBLISH_RUN: ${{ (github.event_name == 'schedule' && steps.published-check.outputs.should-publish == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish == true) }}
          LLM_BACKEND: ${{ vars.LLM_BACKEND || 'anthropic' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          # Optional proxy / self-hosted endpoints — forward whatever the
          # forker set in Settings → Variables. Empty values are a no-op
          # (backends fall back to the official URL in code).
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          MINIMAX_BASE_URL: ${{ vars.MINIMAX_BASE_URL }}
          ZHIPU_BASE_URL: ${{ vars.ZHIPU_BASE_URL }}
          # Generic aliases — handy when pointing at an OpenAI/Anthropic
          # compatible service that isn't one of the named presets (Moonshot,
          # SiliconFlow, OpenRouter, self-hosted, ...). Provider-specific
          # vars above take precedence when both are set.
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          REPORT_LOCALE: ${{ vars.REPORT_LOCALE || 'zh' }}
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
          REPORT_TZ: ${{ vars.REPORT_TZ }}
          # 可选：设为 "true" 跳过实际音频合成（仅注入播放器占位，调试用）。
          # 默认空 → CI 每次正式运行都生成 mp3 并发布。
          SKIP_TTS: ${{ vars.SKIP_TTS }}
          # 腾讯云 TTS（主用）：密钥来自 Secrets；未配置则 tts.ts 自动走 Piper 兜底。
          # 区域/音色/语速来自 Variables（带默认 ap-guangzhou / 501001 智瑜 / 1）。
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_REGION: ${{ vars.TENCENTCLOUD_REGION }}
          TTS_VOICE_TYPE: ${{ vars.TTS_VOICE_TYPE }}
          TTS_SPEED: ${{ vars.TTS_SPEED }}
          WEB_MODE: 'true'
        run: npm run daily

      # ---------- Piper 兜底（场景B：仅腾讯失败时，2026-08-24）----------
      # 腾讯密钥已配置但合成失败 → tts.ts 已写 tts-fallback-needed.txt 标记；
      # 此处才安装 Piper（含模型缓存）并跑 scripts/tts-fallback.ts 补合成，
      # 保证「Piper 只在腾讯失败时发起」。正常腾讯成功时这 4 步全部跳过。
      - name: Setup Python (Piper 兜底)
        if: ${{ steps.tencent-check.outputs.has == 'true' && hashFiles('data/history/reports/*/tts-fallback-needed.txt') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Piper model (兜底)
        if: ${{ steps.tencent-check.outputs.has == 'true' && hashFiles('data/history/reports/*/tts-fallback-needed.txt') != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/piper
          key: piper-zh_CN-huayan-medium-v1
          restore-keys: |
            piper-zh_CN-huayan-medium-

      - name: Install Piper TTS (兜底)
        if: ${{ steps.tencent-check.outputs.has == 'true' && hashFiles('data/history/reports/*/tts-fallback-needed.txt') != '' }}
        run: python3 -m pip install --upgrade pip piper-tts

      - name: Piper fallback synthesis (腾讯失败时)
        if: ${{ steps.tencent-check.outputs.has == 'true' && hashFiles('data/history/reports/*/tts-fallback-needed.txt') != '' }}
        run: npm run tts-fallback

      # 信息源抓取结果数据包（daily 导出），供本地「预 AI 分析加载」任务拉回比对
      # （识别信息源新增条目，不只爬虫数据）。
      - name: Upload fetched sources as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fetched-data
          path: data/fetched-articles.json
          retention-days: 30

      # 每日流程会重写 data/article-history.json（含当日爬虫数据 + 被重新灌入的
      # 旧缓存，可能含陈旧日期）。先裁剪到最近 N 天（默认 7），被移除数据累积写入
      # data/article-history-backup.json（不丢弃），再一次性提交回 main。
      # 2026-08-19：报告归档统一放 main/history/（不再堆根目录）；restore 已改
      # git archive（暂存区干净），本步骤只 add history/ 与 data/ 下的历史文件。
      - name: Trim history to recent N days (keep backup)
        run: node scripts/cleanup-history.mjs

      - name: Archive reports to history/ + commit rolling history
        run: |
          # 1) 归档唯一存储里的报告到 main/history/（daily 产物 data/history/reports/<date>/）
          mkdir -p history
          for d in data/history/reports/20*/; do
            [ -d "$d" ] && cp -r "$d" history/
          done
          # 2) 提交历史库 + 报告归档
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/ data/article-history.json data/article-history-backup.json data/event-memory.json
          if git diff --cached --quiet; then
            echo "历史文件与报告归档无变化，跳过提交"
          else
            git commit -m "chore: 更新历史缓存并归档报告 ($(date -u +%Y-%m-%d))"
            git push
          fi

      # 发布步骤：schedule 固定发布；手动触发按 publish input（false = 仅验证不发布）
      # 2026-08-27：增加「当日已发布则跳过 publish」检查 — build 已全跑过全 AI，publish 一次即可
      # （published-check 步骤已前移到「Generate today's report」之前，见上）
      - name: Build static site (index + archive)
        if: ${{ github.event_name == 'schedule' || inputs.publish == true }}
        run: npm run build-site

      - name: Publish to gh-pages
        # manual 触发 inputs.publish=true → 强制发布（用户选择 = 全局最高变量，覆盖已发布）
        # schedule 触发 → 必须先过 published-check（已有 schedule 正式首发则跳过）
        if: >-
          (github.event_name == 'schedule' && steps.published-check.outputs.should-publish == 'true')
          || inputs.publish == true
        id: publish-gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./daily_reports
          publish_branch: gh-pages
          keep_files: false  # we restored everything above, so a clean publish is fine
          commit_message: 'daily: report for ${{ github.run_id }}'

      # ---------- 发布来源记账（2026-09-03，published-check 严谨化）----------
      # gh-pages push **成功后才**写 data/publish-state.json 并提交 main（先发后记，
      # 避免「记了没发」导致次日误判已发布）。published-check 据此判定：
      #   - source=schedule → 当天正式首发已存在 → 后续 schedule 跳过 publish
      #   - source=manual  → dispatch publish=true 人工覆盖 → 不阻断同日 schedule 首发
      #     （凌晨 dispatch 测试不再吞掉当天正式首发 —— 首次 schedule 命中会再发正式版）
      - name: Record publish source (publish-state.json)
        if: steps.publish-gh-pages.outcome == 'success'
        env:
          REPORT_TZ: ${{ vars.REPORT_TZ }}
          SOURCE: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
        run: |
          npm run record-publish --silent
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publish-state.json
          if git diff --cached --quiet; then
            echo "publish-state 无变化，跳过提交"
          else
            git commit -m "chore: 记录发布来源 (publish-state.json)"
            git push
          fi

      # ---------- 外发渠道已移除（2026-09-03，微信推送改为手动触发）----------
      # 原 Wait 5 min / Push WeChat / Push ServerChan 步骤已删除：
      #   - 发布后不再自动推送任何渠道（schedule 只 publish）；
      #   - 人工核对 gh-pages 报告无误后，单独手动触发 .github/workflows/notify.yml
      #     推送微信（Server酱渠道整体废弃删除）；
      #   - 推送成功时 notify.yml 会写当日交付信号（event-memory.json deliveries），
      #     作为内容记忆 beginDay 的结算闸门。

