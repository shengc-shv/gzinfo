name: Daily Brief (Fixed Cron)

# 2026-09-02 新建：用于排查 GitHub Actions 定时（schedule）丢触发问题。
#
# 与 daily.yml（主流程）的关系：**功能完全一致**，只有「定时任务相关」的部分被写死：
#   1. cron 表达式：不再用 `*/15 * * * *` 高频通配（实测丢触发严重），改为
#      **每天两个固定时间点**（见下方 schedule）。
#   2. gate job：去掉时间窗口匹配（不再读 REPORT_TIMES / WINDOW_MIN / REPORT_DAYS），
#      触发即构建 —— cron 已经写死，无需窗口筛选。只保留并发检查。
#   3. 修正 published-check / Wait 5min 的时区取值 bug（daily.yml 里
#      `TZ='${TZ:-Asia/Shanghai}'` 用了单引号，shell 不展开 → TZ 是无效字面量
#      → date 退回 UTC → 检查的是「前一天」的报告目录 → 定时任务几乎永远
#      判定「今天已发布」而跳过发布）。本文件改双引号 + 传 REPORT_TZ。
#
# ⚠️ cron 时区提醒（最容易踩的坑）：GitHub Actions schedule **固定使用 UTC**，
#    不支持时区写法。北京时间 = UTC+8，所以：
#      北京 06:50 → UTC 22:50（前一自然日）
#      北京 07:20 → UTC 23:20（前一自然日）
#    即：北京当天早上 6:50、7:20 各触发一次（两个 cron 都落在"前一天"的 UTC 夜里）。
#
# 功能类配置（LLM / TTS / 推送 / 报告时区与站点地址）仍从 Variables 读取，
# 与 daily.yml 逐字一致 —— 本文件只改"调度"，不改"业务"。
# 密钥（secrets）依旧走 secrets，那是凭据不是配置。

on:
  schedule:
    # 北京 06:50（UTC 22:50）
    - cron: '50 22 * * *'
    # 北京 07:20（UTC 23:20）
    - cron: '20 23 * * *'
  workflow_dispatch:
    inputs:
      # 与 daily.yml 保持一致：手动触发可独立控制
      skip_ai:
        description: '跳过全部 LLM 调用（复用历史缓存摘要，零 AI 成本；等价原 test2/无 AI 验证）'
        type: boolean
        default: false
      audio:
        description: '生成新音频（false = 跳过音频合成，页面不挂播放器；用于只想看报告文字时省 TTS 成本）'
        type: boolean
        default: true
      publish:
        description: '发布到 gh-pages（false = 仅验证 + 上传 artifact，不发布；等价原 test1）'
        type: boolean
        default: true
      notify_wechat:
        description: '发送微信模板消息推送（默认勾选；仅当 publish=true 时才推，取消勾选=发布但不推送）'
        type: boolean
        default: true
      notify_serverchan:
        description: '发送 Server酱推送（默认不勾；手动触发时独立控制，需同时勾选 notify_wechat；schedule 定时不受此开关影响）'
        type: boolean
        default: false

permissions:
  contents: write  # needed to push to gh-pages branch

jobs:
  # 与原 gate 的区别：不做时间窗口匹配（cron 已写死，触发即构建），
  # 只保留「前一 run 仍在跑则跳过」的并发保护 —— 防止 6:50 那次没跑完时
  # 7:20 又起一个，两者同时写 main（归档提交）会冲突。
  gate:
    name: Concurrency gate (no time window)
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
    steps:
      - name: Check schedule
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # Manual triggers always run — user clicked Run workflow.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual trigger — bypassing gate"
            echo "should-build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip if a previous run of this workflow is still in progress.
          RUNNING=$(curl -s \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/actions/workflows/daily-cron-fixed.yml/runs?status=in_progress&per_page=20" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(len([r for r in d.get('workflow_runs',[]) if r['id'] != ${RUN_ID}]))" 2>/dev/null || echo 0)
          echo "Other running runs of daily-cron-fixed.yml: $RUNNING"
          if [ "$RUNNING" -gt 0 ]; then
            echo "→ Previous run still in progress — skipping this trigger"
            echo "should-build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "✓ Cron trigger accepted — proceeding to build (full AI)"
          echo "should-build=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build & publish
    needs: gate
    if: needs.gate.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ---------- 触发诊断（仅日志，用于观察 cron 是否准时）----------
      # GitHub schedule 是 best-effort，实际启动常晚于计划时刻。
      # 这里把「计划 cron / 实际 UTC / 实际北京时间」都打出来，方便判断：
      #   - run 根本没出现 → cron 被丢
      #   - run 出现了但时间偏很多 → 排队延迟
      - name: Trigger diagnostics
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REPORT_TZ: ${{ vars.REPORT_TZ }}
        run: |
          TZ_VAL="${REPORT_TZ:-Asia/Shanghai}"
          echo "event_name      : ${EVENT_NAME}"
          echo "matched cron    : ${SCHEDULE:-<none>}  (UTC 表达式)"
          echo "planned (UTC)   : $(date -u '+%Y-%m-%d %H:%M:%S %Z')"
          echo "planned (Beijing): $(TZ="$TZ_VAL" date '+%Y-%m-%d %H:%M:%S %Z')"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 探测腾讯密钥是否配置（step 级 if 不支持 secrets 上下文，先转成输出再判断）
      - name: Detect Tencent TTS secret
        id: tencent-check
        env:
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
        run: |
          if [ -n "${TENCENTCLOUD_SECRET_ID}" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------- ffmpeg（腾讯 concat 重编码 + Piper WAV→MP3 都需要，始终安装）----------
      - name: Install ffmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already present: $(ffmpeg -version 2>/dev/null | head -1)"
          else
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi
          command -v ffmpeg >/dev/null 2>&1 || { echo "::error::ffmpeg 安装失败"; exit 1; }

      # ---------- Piper 本地 TTS（无腾讯密钥时主用）----------
      - name: Setup Python (Piper 主用，无腾讯时)
        if: ${{ steps.tencent-check.outputs.has == 'false' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Piper model (主用)
        if: ${{ steps.tencent-check.outputs.has == 'false' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/piper
          key: piper-zh_CN-huayan-medium-v1
          restore-keys: |
            piper-zh_CN-huayan-medium-

      - name: Install Piper TTS (主用)
        if: ${{ steps.tencent-check.outputs.has == 'false' }}
        run: python3 -m pip install --upgrade pip piper-tts

      # Bring previous reports into the workspace so they survive each run
      # and so build-site can list them all in the archive.
      - name: Restore existing reports from gh-pages
        run: |
          mkdir -p daily_reports
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages --depth=1
            git archive origin/gh-pages | tar -x -C daily_reports
            # Drop the index/archive — build-site regenerates them
            rm -f daily_reports/index.html daily_reports/archive.html
            restored=$(ls -1d daily_reports/20*/ 2>/dev/null | wc -l | tr -d ' ')
            echo "Restored ${restored} prior report dirs"
            # Guard against accidentally wiping published history
            if [ "${restored}" -eq 0 ]; then
              echo "::error::gh-pages restore produced no report dirs — aborting to avoid wiping published history"
              exit 1
            fi
          else
            echo "gh-pages doesn't exist yet — first run"
          fi

      # 生成当日报告（全 AI 流程）。功能类配置全部读 Variables，与 daily.yml 一致。
      - name: Generate today's report
        env:
          SKIP_AI: ${{ inputs.skip_ai && 'true' || '' }}
          AUDIO_ENABLED: ${{ inputs.audio && 'true' || 'false' }}
          LLM_BACKEND: ${{ vars.LLM_BACKEND || 'anthropic' }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          MINIMAX_BASE_URL: ${{ vars.MINIMAX_BASE_URL }}
          ZHIPU_BASE_URL: ${{ vars.ZHIPU_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          REPORT_LOCALE: ${{ vars.REPORT_LOCALE || 'zh' }}
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
          REPORT_TZ: ${{ vars.REPORT_TZ }}
          SKIP_TTS: ${{ vars.SKIP_TTS }}
          TENCENTCLOUD_SECRET_ID: ${{ secrets.TENCENTCLOUD_SECRET_ID }}
          TENCENTCLOUD_SECRET_KEY: ${{ secrets.TENCENTCLOUD_SECRET_KEY }}
          TENCENTCLOUD_REGION: ${{ vars.TENCENTCLOUD_REGION }}
          TTS_VOICE_TYPE: ${{ vars.TTS_VOICE_TYPE }}
          TTS_SPEED: ${{ vars.TTS_SPEED }}
          WEB_MODE: 'true'
        run: npm run daily

      # ---------- Piper 兜底（仅腾讯失败时）----------
      - name: Setup Python (Piper 兜底)
        if: ${{ steps.tencent-check.outputs.has == 'true' && hashFiles('data/history/reports/*/tts-fallback-needed.txt') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Piper model (兜底)
        if: ${{ steps.tencent-check.outputs.has == 'true' && hashFiles('data/history/reports/*/tts-fallback-needed.txt') != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/piper
          key: piper-zh_CN-huayan-medium-v1
          restore-keys: |
            piper-zh_CN-huayan-medium-

      - name: Install Piper TTS (兜底)
        if: ${{ steps.tencent-check.outputs.has == 'true' && hashFiles('data/history/reports/*/tts-fallback-needed.txt') != '' }}
        run: python3 -m pip install --upgrade pip piper-tts

      - name: Piper fallback synthesis (腾讯失败时)
        if: ${{ steps.tencent-check.outputs.has == 'true' && hashFiles('data/history/reports/*/tts-fallback-needed.txt') != '' }}
        run: npm run tts-fallback

      - name: Upload fetched sources as artifact
        uses: actions/upload-artifact@v4
        with:
          name: fetched-data
          path: data/fetched-articles.json
          retention-days: 30

      - name: Trim history to recent N days (keep backup)
        run: node scripts/cleanup-history.mjs

      - name: Archive reports to history/ + commit rolling history
        run: |
          mkdir -p history
          for d in data/history/reports/20*/; do
            [ -d "$d" ] && cp -r "$d" history/
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/ data/article-history.json data/article-history-backup.json
          if git diff --cached --quiet; then
            echo "历史文件与报告归档无变化，跳过提交"
          else
            git commit -m "chore: 更新历史缓存并归档报告 ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Build static site (index + archive)
        if: ${{ github.event_name == 'schedule' || inputs.publish == true }}
        run: npm run build-site

      # 检查 gh-pages 当日报告是否已存在（一天最多发布一次）
      # ⚠️ 修复（对比 daily.yml）：原 `TZ='${TZ:-Asia/Shanghai}'` 单引号导致 TZ 不生效
      # → date 退回 UTC → 取到「前一天」日期 → 定时任务几乎永远判定已发布而跳过发布。
      # 这里用双引号 + 显式传 REPORT_TZ，确保按北京时间判断。
      - name: Check if today's report already published
        if: github.event_name == 'schedule'
        id: published-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_TZ: ${{ vars.REPORT_TZ }}
        run: |
          TODAY=$(TZ="${REPORT_TZ:-Asia/Shanghai}" date +%Y-%m-%d)
          echo "Checking publish state for date=${TODAY} (tz=${REPORT_TZ:-Asia/Shanghai})"
          CHECK_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${TODAY}/${TODAY}.html?ref=gh-pages"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$CHECK_URL" || echo "000")
          if [ "$HTTP_CODE" = "404" ]; then
            echo "✓ Today's report not yet published — will publish"
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Today's report already published (HTTP $HTTP_CODE) — skipping publish, build still produced full AI artifacts"
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to gh-pages
        if: >-
          (github.event_name == 'schedule' && steps.published-check.outputs.should-publish == 'true')
          || inputs.publish == true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./daily_reports
          publish_branch: gh-pages
          keep_files: false  # we restored everything above, so a clean publish is fine
          commit_message: 'daily: report for ${{ github.run_id }}'

      # ---------- 等 gh-pages 部署完成（固定等满 5 分钟再推）----------
      - name: Wait 5 min for gh-pages to propagate
        if: >-
          (github.event_name == 'schedule' && steps.published-check.outputs.should-publish == 'true')
          || (github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.notify_wechat == true)
        env:
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
          REPORT_TZ: ${{ vars.REPORT_TZ }}
        run: |
          echo "固定等待 5 分钟（300s），让 gh-pages 部署与 CDN 传播完成…"
          sleep 300
          TODAY=$(TZ="${REPORT_TZ:-Asia/Shanghai}" date +%Y-%m-%d)
          BASE="${REPORT_BASE_URL:-https://shengc-shv.github.io/gzinfo}"
          BASE="${BASE%/}"
          URL="${BASE}/${TODAY}/${TODAY}.html"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 -L "$URL" || echo "000")
          echo "等待结束（5 分钟），报告 URL 最终探测: HTTP ${CODE}（仅日志信息，不影响推送）"

      # ---------- 外发渠道：微信测试号模板消息 + Server酱 ----------
      - name: Push WeChat notification
        id: push-wechat
        if: >-
          (github.event_name == 'schedule' && steps.published-check.outputs.should-publish == 'true')
          || (github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.notify_wechat == true)
        continue-on-error: true
        env:
          WX_APP_ID: ${{ secrets.WX_APP_ID }}
          WX_APP_SECRET: ${{ secrets.WX_APP_SECRET }}
          WX_USER_ID: ${{ secrets.WX_USER_ID }}
          WX_TEMPLATE_ID: 'QTCQrpJe_udqVgJCyWjbkYTbixoU6N392Geo6yC5Y6E'
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
          REPORT_TZ: ${{ vars.REPORT_TZ }}
        run: npm run notify

      - name: Push ServerChan notification
        if: >-
          (github.event_name == 'schedule' && steps.published-check.outputs.should-publish == 'true')
          || (github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.notify_wechat == true && inputs.notify_serverchan == true)
        continue-on-error: true
        env:
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
          REPORT_TZ: ${{ vars.REPORT_TZ }}
        run: npm run notify
