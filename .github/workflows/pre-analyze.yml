name: Pre Analyze (Tag Store)

# M4 · 阶段①晚间预分析：采集 → 筛选 → 产出待打标队列 → 合并打标结果进标签库。
#
# ⚠️ 触发时刻不固定（"20:00" 只是举例），故默认**只保留手动触发**，
#    不启用 schedule —— 避免未经确认定时跑远程任务。
#    需要定时时取消下面的注释（北京 20:00 = UTC 12:00）：
# on:
#   schedule:
#     - cron: "0 12 * * *"
#
# 典型闭环：
#   1) 手动 Run workflow（mode=emit）→ 产出 data/tag-queue.json 并上传 artifact
#   2) 本地 WorkBuddy 读队列打标 → 写 data/tag-incoming.json → 推回仓库
#   3) 再次 Run workflow（mode=commit）→ 合并进 data/tag-store.json 并提交

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "emit=只产出队列 / commit=只合并打标结果 / both=两者（默认）"
        required: false
        default: "both"
      tagger:
        description: "workbuddy=离线打标（默认） / llm=生产 LLM 打标"
        required: false
        default: "workbuddy"

jobs:
  pre-analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: "Asia/Shanghai"
      REPORT_TZ: "Asia/Shanghai"
      REPORT_LOCALE: "zh"
      PIPELINE_PHASE: "pre"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        run: npm ci

      - name: Run pre-analyze
        run: |
          MODE="${{ github.event.inputs.mode }}"
          TAGGER="${{ github.event.inputs.tagger }}"
          ARGS=""
          if [ "$MODE" = "emit" ]; then ARGS="--emit-only"; fi
          if [ "$MODE" = "commit" ]; then ARGS="--commit-only"; fi
          if [ "$TAGGER" = "llm" ]; then ARGS="$ARGS --tagger=llm"; fi
          # 预分析强制 SKIP_AI：绝不触发生产 LLM（脚本内部亦会兜底设置）
          SKIP_AI=true npm run pre-analyze -- $ARGS

      - name: Upload tag queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tag-queue
          path: data/tag-queue.json
          if-no-files-found: ignore

      - name: Commit tag store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # tag-store.json 已被 .gitignore 排除（本地工作产物），此处强制提交真缓存
          git add -f data/tag-store.json || true
          if git diff --cached --quiet; then
            echo "no tag-store changes"
          else
            git commit -m "chore(tagstore): pre-analyze 增量更新标签库"
            git push
          fi
