name: WeChat Notify (Manual)

# 2026-09-03：微信推送从 daily.yml 拆出，改为**人工触发**。
# 2026-09-10：公众号 + 企业号**合并为一条流程**（先公众号、后企业号，任一成功即交付）；
#             内容记忆结算前置到 mark-delivered（Fix A：推送成功即结算，不再次日跨天 + 指纹对账）。
#
# 流程：
#   1. daily.yml 每早（schedule 6:00-8:00 窗口）自动 build + 发布 gh-pages（并归档
#      data/event-memory.json，含当日「暂存区 today」口播）；
#   2. 用户打开报告 URL 人工核对内容无误；
#   3. 手动 Run this workflow → 合并推送：① 公众号（微信测试号模板消息）② 企业号（企业微信，
#      群机器人 Webhook 优先；否则自建应用）。两渠道各自缺配置则跳过，任一成功即交付；
#   4. 推送真正送达（notify 退出 0）→ mark-delivered 写当日「交付信号」(deliveries) 并
#      **立即把当日暂存区结算进长期记忆 (events)**，提交 main。
#      ⚠️ 生效判据 = 触达即生效：渠道无「客户已读」回执，已读不可观测，
#      经用户 2026-09-03 拍板以「推送全量送达」为正式生效判据（未送达/无目标不算交付）。
#
# 并发：concurrency 串行化本 workflow，避免同一天多次手动触发（公众号 / 企业号各跑一次）
# 的 git commit+push 相互覆盖冲突（2026-09-10 复盘：今早两渠道各自触发导致 push 冲突）。
# 不再有任何 schedule 自动推送。Server酱渠道已于同日整体废弃删除。
# 失败语义：两渠道均未送达 → 步骤红 → 不写交付信号（不算交付），用户处理后重试即可；
# 重复触发会重复推送 + 重复打标（微信侧无去重，deliveries 覆盖 pushedAt），请确认后再点。

on:
  # 无输入参数：推送目标 = REPORT_TZ 时区的「今天」报告
  workflow_dispatch: {}

# 串行化：避免同一天多次手动触发（公众号 / 企业号各点一次）的 commit+push 相互覆盖冲突。
concurrency:
  group: notify-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # mark-delivered 需把 event-memory.json 提交回 main

jobs:
  notify:
    name: Push WeChat & mark delivered
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 保险确认：当天 store.json 已被 build run 归档到 main（用户核对 gh-pages 时
      # 必然已归档，此处仅防「当天 build 失败就手动推」的误操作）。
      # 注意：TZ 必须双引号展开（单引号 bug 教训见 daily.yml published-check）。
      - name: Verify today's store.json archived
        env:
          REPORT_TZ: ${{ vars.REPORT_TZ }}
        run: |
          TODAY=$(TZ="${REPORT_TZ:-Asia/Shanghai}" date +%Y-%m-%d)
          if [ ! -f "history/${TODAY}/store.json" ]; then
            echo "::error::history/${TODAY}/store.json 不存在 —— 当天 build 尚未归档；如确需推送请先跑 daily.yml（publish=true）"
            exit 1
          fi
          echo "store.json 已就绪: history/${TODAY}/store.json"

      # 合并推送：公众号 + 企业号（notify-daily.ts 内部按「先公众号后企业号」顺序，
      # 任一成功即 exit 0）。真正送达（目标 ≥1 且全成功）→ exit 0；两渠道均失败/无目标 → exit 1。
      - name: Push notifications (WeChat + WeCom)
        id: push
        env:
          WX_APP_ID: ${{ secrets.WX_APP_ID }}
          WX_APP_SECRET: ${{ secrets.WX_APP_SECRET }}
          WX_USER_ID: ${{ secrets.WX_USER_ID }}
          WX_TEMPLATE_ID: 'QTCQrpJe_udqVgJCyWjbkYTbixoU6N392Geo6yC5Y6E'
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          WECOM_CORP_ID: ${{ secrets.WECOM_CORP_ID }}
          WECOM_AGENT_ID: ${{ secrets.WECOM_AGENT_ID }}
          WECOM_CORP_SECRET: ${{ secrets.WECOM_CORP_SECRET }}
          WECOM_USER_IDS: ${{ secrets.WECOM_USER_IDS }}
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
          REPORT_TZ: ${{ vars.REPORT_TZ }}
        run: npm run notify

      # 推送成功 → 记录当日交付信号（deliveries）并**立即结算**当日暂存进长期记忆（Fix A），
      # 提交 main。mark-delivered 会用 GH_TOKEN 反查 gh-pages 当天 commit，把被推送版本的
      # 发布 run/commit（reportRunId/reportSha）一并写入 deliveries 仅供溯源，不参与结算闸门。
      - name: Mark today as delivered (settle into long-term memory)
        if: steps.push.outcome == 'success'
        env:
          REPORT_TZ: ${{ vars.REPORT_TZ }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run mark-delivered
          TODAY=$(TZ="${REPORT_TZ:-Asia/Shanghai}" date +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/event-memory.json
          if git diff --cached --quiet; then
            echo "event-memory.json 无变化（同日已记录过交付），跳过提交"
          else
            git commit -m "chore: mark delivered ${TODAY}"
            git push
          fi
