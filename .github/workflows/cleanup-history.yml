name: Cleanup article history

# 每周自动清理 data/article-history.json，仅保留最近 7 天的缓存，避免文件无限膨胀。
# - 定时：每周日 04:17 UTC 触发一次
# - 手动：在 Actions 页面点 "Run workflow" 可立即执行，并可覆盖保留天数
on:
  # 2026-09-15 用户要求停止定时跑：已移除 schedule，仅保留手动触发（workflow_dispatch）。
  # 原定时：每周日 UTC 04:17 清理 article-history.json 仅留 7 天。
  workflow_dispatch:
    inputs:
      retention_days:
        description: '保留最近多少天（默认 7）'
        required: false
        default: '7'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Trim article-history.json to recent window
        env:
          RETENTION_DAYS: ${{ github.event.inputs.retention_days || '7' }}
        run: node scripts/cleanup-history.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/article-history.json data/article-history-backup.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: 清理历史缓存，仅保留最近 ${RETENTION_DAYS:-7} 天 ($(date -u +%Y-%m-%d))"
            git push
          fi
