name: Weekly Guangdong Registry Refresh

# 每周一（北京时间）刷新粤企注册表（企业名/股票/城市 单一真相源）。
# 重建 JSON 并在有变化时提交回 main；不发布任何报告。
# （原 test.yml 的 refresh-guangdong-registry job 迁出为独立 workflow，
#   与日报流程解耦，见 2026-08-19 CI 收敛。）

on:
  # 2026-09-15 用户要求停止定时跑：已移除 schedule，仅保留手动触发（workflow_dispatch）。
  # 原定时：每周一 UTC 01:30（北京时间 09:30）刷新粤企注册表。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Weekly gate (only Monday, Asia/Shanghai)
        id: gw
        run: |
          DOW=$(TZ=Asia/Shanghai date +%u)   # 1=Monday
          if [ "$DOW" = "1" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.gw.outputs.run == 'true'

      - name: Setup Node
        if: steps.gw.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh 粤企注册表 (EastMoney F10 复核省份)
        if: steps.gw.outputs.run == 'true'
        run: node scripts/setup/seed-guangdong-registry.mjs

      - name: Commit updated registry (if changed)
        if: steps.gw.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/sources/guangdong-registry.json
          if git diff --cached --quiet; then
            echo "粤企注册表无变化，跳过提交"
          else
            git commit -m "chore: 每周刷新粤企注册表 ($(date -u +%Y-%m-%d))"
            git push
          fi
